# Local development infrastructure.
# Start:  docker compose up -d --wait      (run inside infra/docker)
# Stop:   docker compose down               (data is kept in volumes)
# Reset:  docker compose down -v            (deletes all data!)
#
# Values like ${MYSQL_PASSWORD} come from the .env file next to this file
# (copy .env.example to .env first).

name: langlearn

services:
  mysql:
    image: mysql:8.4 # 8.4 is MySQL's Long-Term-Support line
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      # utf8mb4 = full Unicode (Hindi, Chinese, Japanese, Korean, emoji).
      # MySQL's old "utf8" can't store some characters.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Scripts in this folder run once, the first time the volume is created.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # "healthy" only once MySQL actually accepts connections, not just when the container starts.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    # Append-only file: Redis writes every change to disk, so data survives restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional web UI for browsing the database: http://localhost:8080
  # Only started when asked for: docker compose --profile tools up -d
  adminer:
    image: adminer:6
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  mysql-data:
  redis-data:
