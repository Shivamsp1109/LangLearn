name: backend-ci

# Only run when backend code (or this workflow) changes.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml", ".nvmrc"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml", ".nvmrc"]

# A new push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in backend/package.json ("packageManager").
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # --frozen-lockfile: fail if package.json and the lockfile disagree,
      # so CI installs exactly what was tested locally.
      - run: pnpm install --frozen-lockfile

      # Cheapest checks first, so failures show up fast.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
